server {
    listen 80 default_server;
    server_name _;

    # ── App + WebSocket — both proxy to the same FastAPI/uvicorn process ──────
    # FastAPI serves website/index.html at / and the WebSocket at /ws.
    # We reverse-proxy everything; uvicorn handles routing.
    location / {
        proxy_pass            http://127.0.0.1:8080;
        proxy_http_version    1.1;

        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "upgrade";
        proxy_set_header      X-Real-IP  $remote_addr;
        proxy_set_header      Host       $host;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        # Long-lived WS sessions: keep idle connections open for an hour
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    # ── Health check (used by HAProxy + monitoring) ───────────────────────────
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
}
