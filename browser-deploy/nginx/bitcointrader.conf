server {
    listen 80 default_server;
    server_name _;

    # ── App + WebSocket — both proxy to the same FastAPI/uvicorn process ──────
    # FastAPI serves website/index.html at / and the WebSocket at /ws.
    # We reverse-proxy everything; uvicorn handles routing.
    # ── Static assets — serve directly from disk to avoid hitting Python ──
    location ~ ^/(favicon\.svg|favicon-32\.png|favicon-180\.png|favicon-512\.png|og-card\.jpg)$ {
        root /opt/bitcointrader/repo/website/;
        try_files /$1 =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass            http://127.0.0.1:8080;
        proxy_http_version    1.1;

        proxy_set_header      Upgrade    $http_upgrade;
        proxy_set_header      Connection "upgrade";
        proxy_set_header      X-Real-IP  $remote_addr;
        proxy_set_header      Host       $host;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;

        # Long-lived WS sessions: keep idle connections open for an hour
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
    }

    # ── Health check (used by HAProxy + monitoring) ───────────────────────────
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
}
